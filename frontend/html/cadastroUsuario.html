<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabManager - Cadastro de usuário</title>
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <main class="login-container">

        <div class="header-logo">
            <img src="../img/logologin.png" alt="Logo do LabManager">
        </div>

        <h1>Cadastrar nova conta</h1>

        <form id="form-cadastro">

            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>

            <input type="email" id="email" name="email" placeholder="Digite seu e-mail institucional" required>

            <input type="password" id="senha" name="senha" placeholder="Crie sua senha" required>

            <input type="password" id="confirmar-senha" placeholder="Confirme sua senha" required>

            <button type="submit">CADASTRAR</button>

            <p id="mensagem"></p>

        </form>

        <a href="login.html" class="voltar-login">
            Voltar para o login
        </a>

    </main>

    <script src="../js/usuario.js"></script>
</body>

</html>
