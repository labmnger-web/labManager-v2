<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de materiais - LabManager</title>

    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/material.css">
</head>

<body>

    <header class="header-content">
        <div class="header-logo">
            <a href="../html/index.html">
                <img src="../img/logo.png" alt="Logo">
            </a>
            <div class="usuario-logado">
                <span id="nome-usuario">Nome do usuário</span>
            </div>
        </div>
    </header>

    <div class="page-content">
        <aside class="sidebar">
            <div class="menu-container">
                <button id="menu-button">☰</button>
                <div id="menu" class="menu">
                    <a href="../html/index.html">Página inicial</a>
                    <a href="../html/agendamento.html">Agendamento</a>
                    <a href="../html/material.html">Materiais</a>
                     <a href="../html/sos.html">Contatos de emergência</a>
                    <a href="../html/historico.html">Histórico geral</a>
                </div>
            </div>
        </aside>

        <main class="main-content">

            <h1 class="titulo-materiais">Cadastro de materiais</h1>

            <form class="cadastro-form">

                <label for="categoria">Categoria:</label>
                <select id="categoria" name="categoria" required>
                    <option value="">Selecione uma categoria</option>
                    <option value="vidraria">Vidraria</option>
                    <option value="reagente">Reagente</option>
                    <option value="equipamento">Equipamento</option>
                </select>

                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="descricao">Descrição:</label>
                <textarea id="descricao" name="descricao"></textarea>

                <div id="campo-material" hidden>
                    <label for="material">Material:</label>
                    <input type="text" id="material" name="material">
                </div>

                <div id="campo-capacidade" hidden>
                    <label for="capacidade">Capacidade:</label>
                    <input type="number" id="capacidade" name="capacidade" step="any">

                    <label for="unidade_medida">Unidade de medida:</label>
                    <input type="text" id="unidade_medida" name="unidade_medida" placeholder="Ex: mL, L">
                </div>

                <label for="local_armazenamento">
                    Local de armazenamento:
                </label>
                <input type="text" id="local_armazenamento" name="local_armazenamento" required>

                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" name="quantidade" step="any" required>

                <label for="quantidade_minima">Quantidade mínima:</label>
                <input type="number" id="quantidade_minima" name="quantidade_minima" step="any" required>

                <button type="submit">CADASTRAR</button>

            </form>
        </main>
    </div>

    <footer class="footer">
        <p>Contato: labmnger@gmail.com</p>
        <img src="../img/logoif.png" alt="Logo do LabManager">
    </footer>

    <script src="../script.js"></script>
    <script src="../js/proteger.js"></script>
    <script src="../js/cadastroMaterial.js"></script>

</body>

</html>
