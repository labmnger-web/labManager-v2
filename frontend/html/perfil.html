
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu perfil - LabManager</title>

    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/perfil.css">
</head>

<body>

    <main class="perfil-container">

        <h1>Meu perfil</h1>
        <p>Atualize seus dados ou exclua sua conta.</p>

        <form id="form-perfil">

            <label for="nome">Nome completo</label>
            <input type="text" id="nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" required>

            <label for="senha">Nova senha</label>
            <input type="password" id="senha" required
                placeholder="Digite sua nova senha">

            <p id="mensagem"></p>

            <button type="submit">Salvar alterações</button>

        </form>

        <hr>

        <div class="excluir-conta">
            <h2>Excluir conta</h2>
            <p>Essa ação é permanente e não poderá ser desfeita.</p>

            <button type="button" id="btn-excluir">
                Excluir minha conta
            </button>
        </div>

        <a href="index.html">Voltar para a página inicial</a>

    </main>

    <script src="../js/editarPerfil.js"></script>
    <script src="../js/proteger.js"></script>

</body>
</html>
